  /* Layout: maison de lujo — marfil y arena, campañas a sangre con textura de tejido, titulares serif ligeros, etiquetas en versalitas espaciadas, ángulos rectos. */
  :root{
    --bg:#FBF9F5;

    --surface-2:#F1EDE5;
    --ink:#16223A;
    --ink-2:#5E6573;
    --line:rgba(22,34,58,.12);
    --accent:#94712F;
    --on-ink:#FBF9F5;

  @media (prefers-color-scheme: dark){

    }
  }
  :root[data-theme="dark"]{
    --bg:#141210; --surface:#1B1815; --surface-2:#24201C; --ink:#EEE8DE; --ink-2:#A39A8F;
    --line:rgba(238,232,222,.12); --accent:#D4AF63; --on-ink:#141210; --hero-tone:#2A2620;
    --overlay:rgba(0,0,0,.6); --shadow:0 24px 60px -28px rgba(0,0,0,.8);

  html{ scroll-behavior:smooth; scroll-padding-top:calc(76px + env(safe-area-inset-top, 0px)); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-weight:300; font-size:15px; -webkit-font-smoothing:antialiased; overflow-x:hidden; overflow-x:clip; }

  .f-mono{ font-variant-numeric:tabular-nums; }
  .label{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:400; }

  .zoom{ transition:transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .group:hover .zoom{ transform:scale(1.04); }

  .deed{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .icon-disc{ width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); color:var(--ink); flex-shrink:0; }

  .snap-row{ display:grid; grid-auto-flow:column; grid-auto-columns:72%; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; }
  .snap-row > *{ scroll-snap-align:start; }
  @media (min-width:640px){ .snap-row{ grid-auto-columns:40%; } }
  @media (min-width:1024px){ .snap-row{ grid-auto-flow:row; grid-template-columns:repeat(5, minmax(0,1fr)); overflow:visible; } }

  .field-label{ display:block; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-2); }
  .field{ width:100%; background:transparent; border:0; border-bottom:1px solid var(--line); padding:10px 0; font:inherit; font-size:15px; color:var(--ink); outline:none; border-radius:0; }
  .field:focus{ border-bottom-color:var(--ink); }
  .field::placeholder{ color:var(--ink-2); opacity:.7; }
  textarea.field{ border:1px solid var(--line); padding:12px; resize:none; }
  textarea.field:focus{ border-color:var(--ink); }
  select.field option{ background:var(--surface); color:var(--ink); }

  .modal-wrap{ position:fixed; inset:0; z-index:60; background:var(--overlay); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
    padding:max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .modal{ background:var(--bg); color:var(--ink); border:1px solid var(--line); width:100%; max-height:88vh; overflow-y:auto; padding:36px 28px; position:relative; box-shadow:var(--shadow); animation:fade .3s ease-out; }
  @keyframes fade{ from{ transform:translateY(10px); } to{ transform:none; } }
  .drawer{ animation:slide .35s cubic-bezier(.2,.7,.2,1); }
  @keyframes slide{ from{ transform:translateX(-24px); } to{ transform:none; } }

  .scrollbar-none::-webkit-scrollbar{ display:none; }
  .scrollbar-none{ -ms-overflow-style:none; scrollbar-width:none; }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; scroll-behavior:auto !important; }
  }
</style>

/* ---------------------------------- FUZZY SEARCH ---------------------------------- */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
    }
  }
  return d[m][n];
}

function fuzzyScore(query, target) {
  const q = query.toLowerCase().trim();
  const t = target.toLowerCase();
  if (!q) return 0;
  if (t === q) return 100;
  if (t.startsWith(q)) return 92;
  if (t.includes(q)) return 80;
  const words = t.split(/[\s&]+/).filter(Boolean);
  if (words.some(w => w.startsWith(q))) return 70;
  const dist = Math.min(...words.map(w => levenshtein(q, w)));
  const ratio = 1 - dist / Math.max(q.length, 4);
  return Math.max(0, Math.round(ratio * 55));
}

// Búsqueda combinada: por nombre de bufete (difusa) o por caso/problema descrito (por especialidad)
function caseScore(query, firm) {
  const m = query.toLowerCase();
  let score = 0;
  Object.entries(TOPIC_SIGNALS).forEach(([catId, t]) => {
    const hits = t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0);
    if (hits > 0 && firm.focus.includes(catId)) score += hits * 18;
  });
  const descWords = firm.desc.toLowerCase();
  query.toLowerCase().split(/\s+/).filter(w => w.length > 3).forEach(w => { if (descWords.includes(w)) score += 4; });
  return score;
}

function combinedScore(query, firm) {
  return Math.max(fuzzyScore(query, firm.name), caseScore(query, firm));
}

function searchFirmsFn(query) {
  if (!query.trim()) return { results: [], alsoInterested: [] };
  const scored = FIRMS.map(f => ({ f, score: combinedScore(query, f) })).filter(r => r.score > 12);
  const results = scored
    .sort((a, b) => (b.f.promoted - a.f.promoted) || (b.score - a.score))
    .slice(0, 6)
    .map(r => r.f);
  let alsoInterested = [];
  if (results.length > 0) {
    const anchor = results[0];
    const shownNames = new Set(results.map(f => f.name));
    alsoInterested = FIRMS
      .filter(f => !shownNames.has(f.name) && f.focus.some(cat => anchor.focus.includes(cat)))
      .map(f => ({ f, score: (f.promoted ? 30 : 0) + (4 - f.priceTier) * 10 + (f.since < 2005 ? 8 : 0) }))
      .sort((a, b) => (b.f.promoted - a.f.promoted) || (b.score - a.score))
      .slice(0, 3)
      .map(r => r.f);
  }
  return { results, alsoInterested };
}

function relatedCategoriesForQuery(query) {
  const m = query.toLowerCase();
  return Object.entries(TOPIC_SIGNALS)
    .map(([id, t]) => ({ id, hits: t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0) }))
    .filter(r => r.hits > 0)
    .sort((a, b) => b.hits - a.hits)
    .map(r => CATEGORIES.find(c => c.id === r.id))
    .filter(Boolean);
}

/* ---------------------------------- REFINAR EN 2 PREGUNTAS (auto-avance) ---------------------------------- */
function QuickRefine({ categoryId, onComplete, onCancel }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const q1 = QUESTIONS.find(q => q.cat === categoryId && q.type === "select");
  const steps = [
    { key: "q1", text: q1.text, options: q1.options },
    { key: "q2", text: "¿Qué urgencia tiene tu caso?", options: ["Inmediata (< 1 mes)", "Próximos meses", "Sin prisa, explorando opciones"] },
  ];
  const current = steps[step];

  const choose = (opt) => {
    const next = { ...answers, [current.key]: opt };
    setAnswers(next);
    if (step < steps.length - 1) setStep(step + 1);
    else onComplete(next);
  };
  const back = () => { if (step > 0) setStep(step - 1); else onCancel(); };

  return (
    <div className="deed p-6 md:p-10 mb-12">
      <div className="flex items-center justify-between gap-4 mb-6">
        <div className="eyebrow">Afinar resultado · <span className="f-mono">{step + 1} / {steps.length}</span></div>
        <button onClick={onCancel} className="muted hover:opacity-70" aria-label="Cerrar"><Icon name="x" size={16} /></button>
      </div>
      <div className="grid grid-cols-2 gap-1 mb-8">
        {steps.map((s, i) => <div key={s.key} className="h-px" style={{ background: i <= step ? "var(--ink)" : "var(--line)" }} />)}
      </div>
      <h3 className="f-display text-[1.9rem] leading-tight mb-7">{current.text}</h3>
      <div className="grid sm:grid-cols-2 gap-2.5 mb-7">
        {current.options.map(opt => (
          <button key={opt} onClick={() => choose(opt)}
            className="text-left px-5 py-4 border text-[14.5px] flex items-center justify-between gap-3 transition-colors hover:bg-[var(--surface-2)]"
            style={{ borderColor: "var(--line)" }}>
            {opt} <Icon name="chevronR" size={14} className="muted shrink-0" />
          </button>
        ))}
      </div>
      <button onClick={back} className="link"><Icon name="chevronL" size={13} /> Atrás</button>
    </div>
  );
}

function CategoryResults({ categoryId, favorites, toggleFav, onBack, onContact }) {
  const [refining, setRefining] = useState(false);
  const [refineAnswers, setRefineAnswers] = useState(null);
  const cat = CATEGORIES.find(c => c.id === categoryId);
  const pool = useMemo(() => FIRMS.filter(f => f.focus.includes(categoryId)), [categoryId]);
  const matches = useMemo(() => computeMatches(categoryId, refineAnswers, pool), [categoryId, refineAnswers, pool]);

  useEffect(() => { setRefining(false); setRefineAnswers(null); }, [categoryId]);

  return (
    <section id="resultados" className="gutter py-10 md:py-14">
      <div className="max-w-7xl mx-auto">
        <button onClick={onBack} className="link mb-10"><Icon name="chevronL" size={13} /> Todas las especialidades</button>

          {!refining && (
            <button onClick={() => setRefining(true)} className="btn btn-outline btn-sm">Afinar en 2 preguntas</button>
          )}

        {refineAnswers && !refining && (

        )}

/* ---------------------------------- HELPERS ---------------------------------- */
function useLocalState(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }, [key, val]);
  return [val, setVal];
}

function computeMatches(primaryCat, refineAnswers, pool) {
  const firms = pool || FIRMS;
  const q1 = (refineAnswers?.q1 || "").toLowerCase();
  const q2 = refineAnswers?.q2 || "";
  return firms.map(firm => {
    const sizeNum = parseInt(firm.size) || 20;
    let score = 40;
    if (primaryCat && firm.focus.includes(primaryCat)) score += 10;
    if (firm.promoted) score += 8;
    if (q1 && firm.tags.some(t => t === q1 || q1.includes(t) || t.includes(q1))) score += 40;
    if (q2.startsWith("Inmediata")) {
      score += (sizeNum < 20 ? 16 : 0) + (firm.priceTier <= 2 ? 6 : 0);
    } else if (q2.startsWith("Sin prisa")) {
      score += (firm.since < 2005 ? 16 : 0) + (firm.priceTier >= 3 ? 6 : 0);
    } else if (q2) {
      score += 8;
    }
    score += (firm.since < 2000 ? 6 : firm.since < 2012 ? 3 : 0);
    return { ...firm, match: score };
  }).sort((a, b) => b.match - a.match);
}

const URGENT_WORDS = ["urgente","urgencia","cuanto antes","ya mismo","rápido","rapido","inmediato"];
const GREETINGS = ["hola","buenas","hey","buenos días","buenos dias","buenas tardes"];

function reply(msg) {
  const m = msg.toLowerCase();

  if (GREETINGS.some(g => m.includes(g)) && m.length < 40)
    return "Buenas tardes. Cuéntame brevemente qué necesitas — por ejemplo 'quiero comprar una casa en Bilbao' o 'necesito un visado de nómada digital' — y te digo exactamente qué diagnóstico abrir.";

  const scores = Object.entries(TOPIC_SIGNALS).map(([id, t]) => ({
    id, reply: t.reply, score: t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0),
  })).sort((a, b) => b.score - a.score);

  const top = scores[0];
  const isUrgent = URGENT_WORDS.some(w => m.includes(w));

  if (top.score > 0) {
    const urgentNote = isUrgent ? " Como mencionas urgencia, márcalo también en la pregunta de plazos del diagnóstico: filtramos a los despachos con disponibilidad inmediata." : "";
    return top.reply + urgentNote;
  }

  if (m.includes("precio") || m.includes("coste") || m.includes("honorario") || m.includes("cuánto cuesta") || m.includes("cuanto cuesta"))
    return "Los honorarios varían según el despacho y la complejidad del caso — algunos trabajan a tarifa fija y otros por horas. Si completas el diagnóstico, cada bufete recomendado te lo detalla directamente al contactar.";

  if (m.length < 12)
    return "Cuéntame un poco más — ¿tu duda es sobre una propiedad, un visado, tu familia, tu empresa, impuestos, tu trabajo o un conflicto con alguien?";

  return "Gracias por el detalle. No he identificado con seguridad la rama legal exacta — ¿se trata de propiedad, inmigración, familia, empresa, impuestos, patrimonio, trabajo, un asunto penal, tecnología o un pleito? También puedes describir tu caso directamente en el buscador de arriba.";
}

  const [showMenu, setShowMenu] = useState(false);
  const [showJoinFirm, setShowJoinFirm] = useState(false);
  const [user, setUser] = useLocalState("lexa_user", null);
  const [favorites, setFavorites] = useLocalState("lexa_favorites", []);

  const toggleFav = (name) => {
    setFavorites(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
  };

  const openContact = (firm) => { setContactFirm(firm); setContactStage("policy"); };
  const closeContact = () => { setContactFirm(null); setContactStage("policy"); };

  const toTop = () => window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  const goEspecialidades = () => {
    setPage("especialidades");
    setSelectedCategory(null);
    toTop();
  };
  const goHome = () => {
    setPage("home");
    setSelectedCategory(null);
    toTop();
  };
  const goSection = (id) => {
    setPage("home");
    setSelectedCategory(null);
    setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: "smooth" }), 80);
  };
  const goNews = () => goSection("actualidad");
  const pickCategory = (id) => {
    setSelectedCategory(id);
    setPage("especialidades");
    toTop();
  };
  const runSearch = (q) => {
    setSearchQuery(q);
    setPage("busqueda");
    toTop();
  };
  const logout = () => {
    setUser(null);
    setShowFav(false);
  };

  const BackHome = () => (
    <div className="gutter pt-8">
      <div className="max-w-7xl mx-auto">
        <button onClick={goHome} className="link"><Icon name="chevronL" size={13} /> Inicio</button>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen flex flex-col">
      <div className="gutter py-2.5 text-center text-[10px] tracking-[0.22em] uppercase" style={{ background: "#182544", color: "#E9E3D8" }}>
        Primera consulta confidencial<span className="hidden sm:inline"> <span style={{ color: "#D1A54A" }}>·</span> Sede en Bilbao</span>
      </div>
      <Nav onLogoClick={goHome} onOpenMenu={() => setShowMenu(true)} onExplore={goEspecialidades} onNews={goNews} onOpenFav={() => setShowFav(true)} onOpenAuth={() => user ? setShowFav(true) : setShowAuth(true)} onContact={openContact} onRequireTerms={goEspecialidades} onSearch={runSearch} termsAccepted={termsAccepted} favCount={favorites.length} user={user} />

      <main className="flex-1">
        {page === "home" ? (
          <>
            <Hero onExplore={goEspecialidades} onNews={goNews} />
            <Promises />
            <HomeCategories onPick={pickCategory} onExplore={goEspecialidades} />
            <OfertasBufetes favorites={favorites} toggleFav={toggleFav} onContact={openContact} />
            <NewsFeed />
            <JoinFirmsSection onOpen={() => setShowJoinFirm(true)} />
          </>
        ) : page === "busqueda" ? (
          <>
            <BackHome />
            <SearchResultsPage query={searchQuery} favorites={favorites} toggleFav={toggleFav} onContact={openContact} onPickCategory={pickCategory} />
          </>
        ) : (
          <>
            <BackHome />
            {!termsAccepted ? (
              <TermsGate onAccept={() => setTermsAccepted(true)} />
            ) : selectedCategory ? (
              <CategoryResults categoryId={selectedCategory} favorites={favorites} toggleFav={toggleFav} onBack={() => setSelectedCategory(null)} onContact={openContact} />
            ) : (
              <CategoryGrid onPick={pickCategory} />
            )}
          </>
        )}
      </main>

      <footer className="gutter pt-16" style={{ background: "var(--surface-2)", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 96px)" }}>
        <div className="max-w-7xl mx-auto">
          <div className="text-center mb-14">
            <div className="flex justify-center mb-4"><Logo size={48} /></div>
            <div className="f-display text-[1.8rem] tracking-[0.32em] pl-[0.32em]">LEXA LG</div>
            <div className="eyebrow justify-center mt-3">Legal Group · desde 2004</div>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-10 text-[13.5px]">
            <div className="col-span-2 md:col-span-1">
              <div className="label mb-4">La casa</div>
              <p className="muted leading-relaxed max-w-xs">Plataforma de intermediación que conecta clientes internacionales con despachos seleccionados en España.</p>
            </div>
            <div>
              <div className="label mb-4">Especialidades</div>
              <div className="flex flex-col gap-2.5 items-start">
                {CATEGORIES.slice(0, 5).map(c => <button key={c.id} onClick={() => pickCategory(c.id)} className="muted hover:text-[var(--ink)] text-left">{c.label.split(/,| &/)[0]}</button>)}
              </div>
            </div>
            <div>
              <div className="label mb-4">&nbsp;</div>
              <div className="flex flex-col gap-2.5 items-start">
                {CATEGORIES.slice(5).map(c => <button key={c.id} onClick={() => pickCategory(c.id)} className="muted hover:text-[var(--ink)] text-left">{c.label.split(/,| &/)[0]}</button>)}
              </div>
            </div>
            <div className="col-span-2 md:col-span-1">
              <div className="label mb-4">Sede</div>
              <p className="muted leading-relaxed">Bilbao, Bizkaia</p>
              <button onClick={() => setShowJoinFirm(true)} className="link-u mt-6">Únete como despacho</button>
            </div>
          </div>
          <div className="mt-14 pt-6 flex flex-col md:flex-row justify-between gap-3 text-[11.5px] muted" style={{ borderTop: "1px solid var(--line)" }}>
            <span>© Lexa LG — Legal Group</span>
            <span>Prototipo demostrativo. Los despachos y datos mostrados son ficticios.</span>
          </div>
        </div>
      </footer>

      {contactFirm && contactStage === "policy" && (
        <ConsentModal
          onClose={closeContact}
          onAccept={() => setContactStage("form")}
        />
      )}
      {contactFirm && contactStage === "form" && (
        <ContactFormModal
          firm={contactFirm}
          onClose={closeContact}
          onSubmit={closeContact}
        />
      )}
      {showMenu && <MenuDrawer onClose={() => setShowMenu(false)} onPick={pickCategory} onExplore={goEspecialidades} onNews={goNews} onOfertas={() => goSection("ofertas")} onJoin={() => setShowJoinFirm(true)} />}
      {showAuth && <AuthModal onClose={() => setShowAuth(false)} onLogin={(u) => { setUser(u); setShowAuth(false); }} />}
      {showFav && <FavoritesPanel favorites={favorites} toggleFav={toggleFav} onClose={() => setShowFav(false)} user={user} onLogout={logout} />}
      {showJoinFirm && <JoinFirmModal onClose={() => setShowJoinFirm(false)} />}

      <Concierge onOpenWizard={goEspecialidades} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
