  /* Layout: maison de lujo — marfil y arena, campañas a sangre con textura de tejido, titulares serif ligeros, etiquetas en versalitas espaciadas, ángulos rectos. */
  :root{
    --bg:#FBF9F5;
    --surface:#FFFFFF;
    --surface-2:#F1EDE5;
    --ink:#16223A;
    --ink-2:#5E6573;
    --line:rgba(22,34,58,.12);

    --on-ink:#FBF9F5;

  }
  :root[data-theme="dark"]{

    --line:rgba(238,232,222,.12); --accent:#D4AF63; --on-ink:#141210; --hero-tone:#2A2620;
    --overlay:rgba(0,0,0,.6); --shadow:0 24px 60px -28px rgba(0,0,0,.8);
    color-scheme:dark;
  }
  html{ scroll-behavior:smooth; scroll-padding-top:calc(76px + env(safe-area-inset-top, 0px)); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-weight:400; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; overflow-x:clip; }

  .f-mono{ font-variant-numeric:tabular-nums; }
  .label{ font-size:13px; letter-spacing:.1em; text-transform:uppercase; font-weight:400; }
  .eyebrow{ font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:10px; }

  .rule{ width:36px; height:1px; background:currentColor; opacity:.5; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; font-size:14px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; padding:16px 28px; border:1px solid transparent; border-radius:0; transition:background-color .25s, color .25s, border-color .25s, opacity .25s; cursor:pointer; white-space:nowrap; }

  .weave{ background-color:var(--tone, #C9B8A3);

  .zoom{ transition:transform 1.2s cubic-bezier(.2,.7,.2,1); }

  .deed{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .icon-disc{ width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); color:var(--ink); flex-shrink:0; }

  .snap-row{ display:grid; grid-auto-flow:column; grid-auto-columns:72%; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; }
  .snap-row > *{ scroll-snap-align:start; }
  @media (min-width:640px){ .snap-row{ grid-auto-columns:40%; } }
  @media (min-width:1024px){ .snap-row{ grid-auto-flow:row; grid-template-columns:repeat(5, minmax(0,1fr)); overflow:visible; } }

  .field-label{ display:block; font-size:14px; font-weight:700; letter-spacing:0; color:var(--ink-2); }
  .field{ width:100%; background:transparent; border:0; border-bottom:1px solid var(--line); padding:10px 0; font:inherit; font-size:17px; color:var(--ink); outline:none; border-radius:0; }
  .field:focus{ border-bottom-color:var(--ink); }
  .field::placeholder{ color:var(--ink-2); opacity:.7; }
  textarea.field{ border:1px solid var(--line); padding:12px; resize:none; }
  textarea.field:focus{ border-color:var(--ink); }
  select.field option{ background:var(--surface); color:var(--ink); }

  .modal-wrap{ position:fixed; inset:0; z-index:60; background:var(--overlay); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
    padding:max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .modal{ background:var(--bg); color:var(--ink); border:1px solid var(--line); width:100%; max-height:88vh; overflow-y:auto; padding:36px 28px; position:relative; box-shadow:var(--shadow); animation:fade .3s ease-out; }
  @keyframes fade{ from{ transform:translateY(10px); } to{ transform:none; } }
  .sheet{ animation:rise .35s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise{ from{ transform:translateY(28px); } to{ transform:none; } }
  .drawer{ animation:slide .35s cubic-bezier(.2,.7,.2,1); }
  @keyframes slide{ from{ transform:translateX(-24px); } to{ transform:none; } }

  .scrollbar-none::-webkit-scrollbar{ display:none; }
  .scrollbar-none{ -ms-overflow-style:none; scrollbar-width:none; }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; scroll-behavior:auto !important; }

</style>

/* ---------------------------------- FUZZY SEARCH ---------------------------------- */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
    }
  }
  return d[m][n];
}

function fuzzyScore(query, target) {
  const q = query.toLowerCase().trim();
  const t = target.toLowerCase();
  if (!q) return 0;
  if (t === q) return 100;
  if (t.startsWith(q)) return 92;
  if (t.includes(q)) return 80;
  const words = t.split(/[\s&]+/).filter(Boolean);
  if (words.some(w => w.startsWith(q))) return 70;
  const dist = Math.min(...words.map(w => levenshtein(q, w)));
  const ratio = 1 - dist / Math.max(q.length, 4);
  return Math.max(0, Math.round(ratio * 55));
}

// Búsqueda combinada: por nombre de bufete (difusa) o por caso/problema descrito (por especialidad)
function caseScore(query, firm) {
  const m = query.toLowerCase();
  let score = 0;
  Object.entries(TOPIC_SIGNALS).forEach(([catId, t]) => {
    const hits = t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0);
    if (hits > 0 && firm.focus.includes(catId)) score += hits * 18;
  });
  const descWords = firm.desc.toLowerCase();
  query.toLowerCase().split(/\s+/).filter(w => w.length > 3).forEach(w => { if (descWords.includes(w)) score += 4; });
  return score;
}

function combinedScore(query, firm) {
  return Math.max(fuzzyScore(query, firm.name), caseScore(query, firm));
}

function searchFirmsFn(query) {
  if (!query.trim()) return { results: [], alsoInterested: [] };
  const scored = FIRMS.map(f => ({ f, score: combinedScore(query, f) })).filter(r => r.score > 12);
  const results = scored
    .sort((a, b) => (b.f.promoted - a.f.promoted) || (b.score - a.score))
    .slice(0, 6)
    .map(r => r.f);
  let alsoInterested = [];
  if (results.length > 0) {
    const anchor = results[0];
    const shownNames = new Set(results.map(f => f.name));
    alsoInterested = FIRMS
      .filter(f => !shownNames.has(f.name) && f.focus.some(cat => anchor.focus.includes(cat)))
      .map(f => ({ f, score: (f.promoted ? 30 : 0) + (4 - f.priceTier) * 10 + (f.since < 2005 ? 8 : 0) }))
      .sort((a, b) => (b.f.promoted - a.f.promoted) || (b.score - a.score))
      .slice(0, 3)
      .map(r => r.f);
  }
  return { results, alsoInterested };
}

function relatedCategoriesForQuery(query) {
  const m = query.toLowerCase();
  return Object.entries(TOPIC_SIGNALS)
    .map(([id, t]) => ({ id, hits: t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0) }))
    .filter(r => r.hits > 0)
    .sort((a, b) => b.hits - a.hits)
    .map(r => CATEGORIES.find(c => c.id === r.id))
    .filter(Boolean);
}

// Carrusel: se desliza con el dedo, con el ratón (arrastrando) o con las flechas
function useDragScroll() {
  const ref = useRef(null);
  const drag = useRef(null);
  const onPointerDown = (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    const el = ref.current;
    drag.current = { x: e.clientX, left: el.scrollLeft, moved: false };
    el.style.scrollSnapType = "none";
    el.style.cursor = "grabbing";
  };
  const onPointerMove = (e) => {
    const d = drag.current; if (!d) return;
    const dx = e.clientX - d.x;
    if (Math.abs(dx) > 5) d.moved = true;
    ref.current.scrollLeft = d.left - dx;
  };
  const end = () => {
    const el = ref.current; if (!drag.current || !el) return;
    el.style.cursor = ""; el.style.scrollSnapType = "";
    setTimeout(() => { drag.current = null; }, 0);
  };
  // Si se ha arrastrado, el clic que sigue no abre la especialidad
  const onClickCapture = (e) => { if (drag.current?.moved) { e.stopPropagation(); e.preventDefault(); } };
  const step = (dir) => {
    const el = ref.current; if (!el) return;
    const tile = el.firstElementChild;
    el.scrollBy({ left: dir * ((tile?.offsetWidth || 240) + 12), behavior: "smooth" });
  };
  return { ref, step, handlers: { onPointerDown, onPointerMove, onPointerUp: end, onPointerLeave: end, onClickCapture, onDragStart: e => e.preventDefault() } };
}

function HomeCategories({ onPick, onExplore }) {
  const { ref, step, handlers } = useDragScroll();
  const [edge, setEdge] = useState({ start: true, end: false });
  const update = () => {
    const el = ref.current; if (!el) return;
    setEdge({ start: el.scrollLeft < 8, end: el.scrollLeft + el.clientWidth > el.scrollWidth - 8 });
  };
  useEffect(() => { update(); window.addEventListener("resize", update); return () => window.removeEventListener("resize", update); }, []);
  const arrow = (dir, disabled) => (
    <button onClick={() => step(dir)} disabled={disabled} aria-label={dir < 0 ? "Especialidades anteriores" : "Más especialidades"}

    <section className="gutter py-20 md:py-28">
      <div className="max-w-7xl mx-auto">

/* ---------------------------------- REFINAR EN 2 PREGUNTAS (auto-avance) ---------------------------------- */
function QuickRefine({ categoryId, onComplete, onCancel }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const q1 = QUESTIONS.find(q => q.cat === categoryId && q.type === "select");
  const steps = [
    { key: "q1", text: q1.text, options: q1.options },
    { key: "q2", text: "¿Qué urgencia tiene tu caso?", options: ["Inmediata (< 1 mes)", "Próximos meses", "Sin prisa, explorando opciones"] },
  ];
  const current = steps[step];

  const choose = (opt) => {
    const next = { ...answers, [current.key]: opt };
    setAnswers(next);
    if (step < steps.length - 1) setStep(step + 1);
    else onComplete(next);
  };
  const back = () => { if (step > 0) setStep(step - 1); else onCancel(); };

  return (
    <div className="deed p-6 md:p-10 mb-12">
      <div className="flex items-center justify-between gap-4 mb-6">
        <div className="eyebrow">Afinar resultado · <span className="f-mono">{step + 1} / {steps.length}</span></div>
        <button onClick={onCancel} className="muted hover:opacity-70" aria-label="Cerrar"><Icon name="x" size={16} /></button>
      </div>
      <div className="grid grid-cols-2 gap-1 mb-8">
        {steps.map((s, i) => <div key={s.key} className="h-px" style={{ background: i <= step ? "var(--ink)" : "var(--line)" }} />)}
      </div>
      <h3 className="f-display text-[1.9rem] leading-tight mb-7">{current.text}</h3>
      <div className="grid sm:grid-cols-2 gap-2.5 mb-7">
        {current.options.map(opt => (
          <button key={opt} onClick={() => choose(opt)}
            className="text-left px-5 py-4 border text-[16px] flex items-center justify-between gap-3 transition-colors hover:bg-[var(--surface-2)]"
            style={{ borderColor: "var(--line)" }}>
            {opt} <Icon name="chevronR" size={14} className="muted shrink-0" />
          </button>
        ))}
      </div>
      <button onClick={back} className="link"><Icon name="chevronL" size={13} /> Atrás</button>
    </div>
  );
}

  const matches = useMemo(() => computeMatches(categoryId, refineAnswers, pool), [categoryId, refineAnswers, pool]);

  useEffect(() => { setRefining(false); setRefineAnswers(null); }, [categoryId]);

  return (

      <div className="max-w-7xl mx-auto">

function PlanCard({ id, current, onChoose }) {
  const { trialUsed } = React.useContext(AccountContext);
  const a = ACCOUNTS[id];

  const isCurrent = current === id;
  return (
    <div className="p-6 md:p-7 flex flex-col min-w-0" style={dark ? { background: "#182544", color: "#EEE8DE" } : { background: "var(--surface)", border: "1px solid var(--line)" }}>
      <div className="flex items-center justify-between gap-2">
        <span className="f-display text-[1.6rem] leading-none">{a.name}</span>
        {isCurrent ? <span className="pill-lacre" style={{ background: dark ? "#EEE8DE" : "var(--ink)", color: dark ? "#182544" : "var(--on-ink)" }}>Tu cuenta</span>
          : a.tag ? <span className="pill-lacre" style={{ background: "var(--ink)", color: "var(--on-ink)" }}>{a.tag}</span> : null}
      </div>
      <div className="f-display text-[2.3rem] leading-none mt-3">{a.price ? `${a.price} €` : "0 €"}<span className="text-[14.5px]" style={{ opacity: .7 }}>{a.price ? " / mes" : " · para siempre"}</span></div>

      <ul className="mt-5 space-y-2.5 text-[15.5px] leading-snug flex-1">
        {a.lines.map(l => <li key={l} className="flex gap-2.5"><span className="shrink-0 mt-0.5" style={{ color: dark ? "#D1A54A" : "var(--accent)" }}><Icon name="check" size={15} /></span>{l}</li>)}
      </ul>
      <button onClick={() => onChoose(id)} disabled={isCurrent} className="btn mt-7 disabled:opacity-50 disabled:cursor-default"
        style={dark ? { background: "#EEE8DE", color: "#182544" } : a.price ? { background: "var(--ink)", color: "var(--on-ink)" } : { border: "1px solid var(--ink)", color: "var(--ink)" }}>

function CheckoutModal({ id, onConfirm, onClose }) {
  const { trialUsed } = React.useContext(AccountContext);
  const a = ACCOUNTS[id];
  const [isTrial] = useState(!!a.trial && !trialUsed);
  const [ends] = useState(() => Date.now() + TRIAL_DAYS * 864e5);
  const [company, setCompany] = useState("");
  const [done, setDone] = useState(false);
  const ok = !a.biz || company.trim();
  return (
    <div className="modal-wrap">
      <div className="modal max-w-md scrollbar-none">
        <button type="button" onClick={onClose} className="absolute top-5 right-5 muted hover:opacity-70" aria-label="Cerrar"><Icon name="x" size={18} /></button>
        {done ? (
          <SentState title={isTrial ? `Tu prueba ${a.name} ha empezado` : `Ya tienes cuenta ${a.name}`} onClose={onClose}>
            {isTrial ? `Hasta el ${fmtDay(ends)} ves todos los despachos que encajan con tu caso y tus contactos van por la vía prioritaria. Si cancelas antes de esa fecha, no pagas nada.` : a.rank >= 2 ? "Verás todos los despachos y, en cada búsqueda, el despacho a medida para tu caso." : "Ya ves todos los despachos que encajan con tu caso y tus contactos van por la vía prioritaria."}
            <span className="block mt-3 text-[13px]">Prototipo: no se ha realizado ningún cargo.</span>
          </SentState>
        ) : (
          <>
            <ModalHead eyebrow="Suscripción" title={`Cuenta ${a.name}`} />
            {a.biz && (
              <div className="mb-6">
                <label htmlFor="checkout-company" className="field-label">Empresa</label>
                <input id="checkout-company" value={company} onChange={e => setCompany(e.target.value)} className="field" />
              </div>
            )}
            <ul className="space-y-2 text-[15.5px] mb-6">
              {a.lines.map(l => <li key={l} className="flex gap-2.5"><span className="shrink-0 mt-0.5" style={{ color: "var(--accent)" }}><Icon name="check" size={15} /></span>{l}</li>)}
            </ul>
            <div className="flex justify-between gap-4 py-4 text-[17px]" style={{ borderTop: "1px solid var(--ink)", fontWeight: 700 }}>
              <span>{isTrial ? "Hoy pagas" : "Total al mes (IVA incl.)"}</span><span className="f-mono">{isTrial ? "0 €" : `${a.price} €`}</span>
            </div>
            {isTrial && <p className="text-[15px] mb-3">Desde el <strong>{fmtDay(ends)}</strong>: {a.price} €/mes (IVA incl.) si no cancelas antes. Te lo recordaremos por correo 2 días antes. Una prueba por persona.</p>}
            <p className="text-[14px] muted">{ACCOUNT_NOTE}</p>
            <div className="mt-5 p-4 text-[14px] flex gap-3" style={{ background: "var(--surface-2)" }}>
              <Icon name="lock" size={16} className="shrink-0 mt-0.5" />
              <span>Aquí irá el pago seguro con tarjeta (Stripe). En este prototipo no se pide ningún dato de pago.</span>
            </div>
            <button onClick={() => { onConfirm(id, isTrial ? ends : null); setDone(true); }} disabled={!ok} className="btn btn-primary w-full mt-6">{isTrial ? `Empezar ${TRIAL_DAYS} días gratis (demo)` : `Activar cuenta (demo) · ${a.price} €/mes`}</button>
          </>
        )}
      </div>
    </div>
  );
}

/* Listado de despachos según la cuenta: la gratuita ve los 3 de mejor encaje; Premium recibe además su despacho a medida */
function GatedResults({ list, ctx, favorites, toggleFav, onContact, topPickFirst }) {
  const { account, openPlans, trialUsed } = React.useContext(AccountContext);
  const openFirm = React.useContext(FirmSheetContext);
  const rank = ACCOUNTS[account].rank;
  const visible = rank >= 1 ? list : list.slice(0, FREE_VISIBLE);
  const hidden = list.slice(visible.length);
  const pick = list[0];
  const card = (firm, i) => (
    <FirmCard key={firm.name} firm={firm} isFav={favorites.includes(firm.name)} onToggleFav={toggleFav} onContact={() => onContact(firm)} topPick={topPickFirst && i === 0} ctx={ctx} />
  );
  return (
    <>
      {pick && (rank >= 2 ? (
        <div className="mb-12 grid md:grid-cols-[200px_1fr] gap-6 p-6 md:p-8" style={{ background: "#182544", color: "#EEE8DE" }}>
          <div className="w-[120px] md:w-full"><FirmCrest name={pick.name} size={120} /></div>
          <div className="min-w-0">
            <div className="label mb-2" style={{ color: "#D1A54A", fontSize: 12 }}>Tu despacho a medida</div>
            <h3 className="f-display text-[2rem] leading-tight">{pick.name}</h3>
            <ul className="mt-4 space-y-2 text-[15.5px]">
              {(fitReasons(pick, ctx).length ? fitReasons(pick, ctx) : [pick.desc]).map(r => <li key={r} className="flex gap-2.5"><span className="shrink-0 mt-0.5" style={{ color: "#D1A54A" }}><Icon name="check" size={15} /></span>{r}</li>)}
            </ul>
            <div className="flex flex-wrap gap-3 mt-6">
              <button onClick={() => onContact(pick)} className="btn" style={{ background: "#EEE8DE", color: "#182544" }}>Contactar</button>
              <button onClick={() => openFirm(pick, ctx)} className="btn btn-light">Ver ficha</button>
            </div>
          </div>
        </div>
      ) : (
        <button onClick={() => openPlans("personal")} className="w-full mb-12 p-5 md:p-6 flex items-center gap-4 text-left" style={{ border: "1px solid var(--ink)" }}>
          <span className="shrink-0"><AurkiAvatar size={44} /></span>
          <span className="min-w-0 flex-1">
            <span className="eyebrow block mb-1">Despacho a medida · cuenta Premium</span>
            <span className="text-[16px] leading-snug block">Te decimos cuál de estos despachos es el ideal para tu caso y por qué, con reunión al siguiente día laborable.</span>
          </span>
          <Icon name="chevronR" size={18} className="shrink-0" />
        </button>
      ))}

      <div className="eyebrow justify-center mb-8">{rank >= 1 ? `${list.length} despachos encajan` : `Los ${visible.length} que mejor encajan · de ${list.length}`}</div>
      <div className="grid grid-cols-2 lg:grid-cols-3 gap-x-3 md:gap-x-6 gap-y-12">
        {visible.map(card)}
      </div>

      {hidden.length > 0 && (
        <div className="mt-12 p-6 md:p-8 flex flex-col md:flex-row md:items-center gap-6" style={{ background: "var(--surface-2)" }}>
          <div className="flex -space-x-3 shrink-0" aria-hidden="true">
            {hidden.slice(0, 4).map(f => <span key={f.name} style={{ filter: "blur(3px)", opacity: .8 }}><FirmCrest name={f.name} size={52} /></span>)}
          </div>
          <div className="min-w-0 flex-1">
            <h3 className="f-display text-[1.5rem] leading-snug">Hay {hidden.length} {hidden.length === 1 ? "despacho más" : "despachos más"} que {hidden.length === 1 ? "encaja" : "encajan"} con tu caso</h3>
            <p className="text-[15.5px] muted mt-1">Con la cuenta Plus los ves todos y tu contacto va por la vía prioritaria: reunión en 2 días laborables.</p>
          </div>
          <button onClick={() => openPlans("personal")} className="btn btn-primary shrink-0">{trialUsed ? "Ver todos · 19 €/mes" : "Pruébalo 7 días gratis"}</button>
        </div>
      )}
    </>
  );
}

const FirmSheetContext = React.createContext(() => {});
const FEE_WORDS = { 1: "Honorarios accesibles", 2: "Honorarios medios", 3: "Honorarios de gama alta" };

// Motivos por los que el despacho encaja, según el cribado: especialidad, respuestas de "afinar" o texto buscado
function fitReasons(firm, ctx = {}) {
  const out = [];
  const label = (id) => CATEGORIES.find(c => c.id === id)?.label;
  if (ctx.categoryId && firm.focus.includes(ctx.categoryId)) out.push(`Especialista en ${label(ctx.categoryId)}.`);
  const q1 = (ctx.answers?.q1 || "").toLowerCase();
  if (q1 && firm.tags.some(t => t === q1 || q1.includes(t) || t.includes(q1))) out.push(`Lleva casos de «${ctx.answers.q1}», lo que nos contaste.`);
  const q2 = ctx.answers?.q2 || "";
  const partners = parseInt(firm.size) || 0;
  if (q2.startsWith("Inmediata") && partners < 20) out.push(`Equipo ágil (${partners} socios), adecuado para un caso urgente.`);
  if (q2.startsWith("Sin prisa") && firm.since < 2005) out.push(`Trayectoria desde ${firm.since}, si prefieres experiencia a rapidez.`);
  if (ctx.query) {
    const cats = relatedCategoriesForQuery(ctx.query).filter(c => firm.focus.includes(c.id));
    if (cats.length) out.push(`Tu caso («${ctx.query}») entra en ${cats.map(c => c.label).join(" y ")}, una de sus especialidades.`);
    else if (fuzzyScore(ctx.query, firm.name) >= 70) out.push(`Coincide con el nombre que buscaste.`);
  }
  return out;
}

/* ---------------------------------- HELPERS ---------------------------------- */
function useLocalState(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }, [key, val]);
  return [val, setVal];
}

function computeMatches(primaryCat, refineAnswers, pool) {
  const firms = pool || FIRMS;
  const q1 = (refineAnswers?.q1 || "").toLowerCase();
  const q2 = refineAnswers?.q2 || "";
  return firms.map(firm => {
    const sizeNum = parseInt(firm.size) || 20;
    let score = 40;
    if (primaryCat && firm.focus.includes(primaryCat)) score += 10;
    if (firm.promoted) score += 8;
    if (q1 && firm.tags.some(t => t === q1 || q1.includes(t) || t.includes(q1))) score += 40;
    if (q2.startsWith("Inmediata")) {
      score += (sizeNum < 20 ? 16 : 0) + (firm.priceTier <= 2 ? 6 : 0);
    } else if (q2.startsWith("Sin prisa")) {
      score += (firm.since < 2005 ? 16 : 0) + (firm.priceTier >= 3 ? 6 : 0);
    } else if (q2) {
      score += 8;
    }
    score += (firm.since < 2000 ? 6 : firm.since < 2012 ? 3 : 0);
    return { ...firm, match: score };
  }).sort((a, b) => b.match - a.match);
}

const URGENT_WORDS = ["urgente","urgencia","cuanto antes","ya mismo","rápido","rapido","inmediato"];
const GREETINGS = ["hola","buenas","hey","buenos días","buenos dias","buenas tardes"];

function reply(msg) {
  const m = msg.toLowerCase();

  if (GREETINGS.some(g => m.includes(g)) && m.length < 40)
    return "¡Hola! Cuéntame brevemente qué necesitas, por ejemplo «quiero comprar una casa en Bilbao» o «necesito un visado de nómada digital», y te digo qué especialidad te corresponde.";

  const scores = Object.entries(TOPIC_SIGNALS).map(([id, t]) => ({
    id, reply: t.reply, score: t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0),
  })).sort((a, b) => b.score - a.score);

  const top = scores[0];
  const isUrgent = URGENT_WORDS.some(w => m.includes(w));

  if (top.score > 0) {
    const urgentNote = isUrgent ? " Como mencionas urgencia, márcalo también en la pregunta de plazos del diagnóstico: filtramos a los despachos con disponibilidad inmediata." : "";
    return top.reply + urgentNote;
  }

  if (m.includes("precio") || m.includes("coste") || m.includes("honorario") || m.includes("cuánto cuesta") || m.includes("cuanto cuesta"))
    return "Los honorarios varían según el despacho y la complejidad del caso — algunos trabajan a tarifa fija y otros por horas. Si completas el diagnóstico, cada bufete recomendado te lo detalla directamente al contactar.";

  if (m.length < 12)
    return "Cuéntame un poco más — ¿tu duda es sobre una propiedad, un visado, tu familia, tu empresa, impuestos, tu trabajo o un conflicto con alguien?";

  return "Gracias por el detalle. No he identificado con seguridad la rama legal exacta — ¿se trata de propiedad, inmigración, familia, empresa, impuestos, patrimonio, trabajo, un asunto penal, tecnología o un pleito? También puedes describir tu caso directamente en el buscador de arriba.";
}

      <path d="M52.8 19.8l3.6 3.6" stroke="#D1A54A" strokeWidth="2.8" strokeLinecap="round" />
    </svg>
  );
}

function Concierge({ onOpenWizard }) {
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([{ from: "bot", text: "Hola, soy Aurki, el asistente de Lexa LG. Cuéntame qué te pasa con tus palabras y te ayudo a encontrar la especialidad y el despacho adecuados. No necesitas darme tu nombre, y lo que me cuentes no llega a ningún despacho sin tu permiso." }]);
  const starters = ["Me han despedido", "Quiero comprar una casa", "Tengo una herencia"];
  const [input, setInput] = useState("");
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, [msgs, open]);

  const send = () => {
    if (!input.trim()) return;
    const userMsg = input.trim();
    setMsgs(m => [...m, { from: "user", text: userMsg }]);
    setInput("");
    setTimeout(() => setMsgs(m => [...m, { from: "bot", text: reply(userMsg) }]), 450);
  };

  const edge = { right: "max(16px, calc(env(safe-area-inset-right, 0px) + 12px))" };

  return (
    <>
      {open && (
        <div className="fixed z-50 w-[calc(100vw-32px)] max-w-sm h-[480px] max-h-[72vh] flex flex-col overflow-hidden"
          style={{ ...edge, bottom: "calc(env(safe-area-inset-bottom, 0px) + 88px)", background: "var(--bg)", border: "1px solid var(--line)", boxShadow: "var(--shadow)" }}>
          <div className="flex items-center gap-3 px-5 py-4" style={{ borderBottom: "1px solid var(--line)" }}>
            <span className="relative">
              <AurkiAvatar size={42} />
              <span className="absolute bottom-0 right-0 w-3 h-3 rounded-full" style={{ background: "#3FA36B", border: "2px solid var(--bg)" }} />
            </span>
            <div>
              <div className="f-display text-[1.3rem] leading-none">Aurki</div>
              <div className="text-[13px] muted mt-1">En línea · gratis y confidencial</div>
            </div>
            <button onClick={() => setOpen(false)} className="ml-auto muted hover:opacity-70" aria-label="Cerrar"><Icon name="x" size={16} /></button>
          </div>
          <div className="flex-1 overflow-y-auto scrollbar-none px-5 py-5 space-y-4">
            {msgs.map((m, i) => (
              m.from === "bot" ? (
                <div key={i} className="flex gap-2.5 max-w-[92%]">
                  <span className="mt-0.5"><AurkiAvatar size={28} /></span>
                  <div className="text-[15.5px] leading-relaxed min-w-0">{m.text}</div>
                </div>
              ) : (
                <div key={i} className="max-w-[86%] ml-auto px-4 py-3 text-[15.5px] leading-relaxed" style={{ background: "var(--surface-2)" }}>{m.text}</div>
              )
            ))}
            {msgs.length === 1 && (
              <div className="flex flex-wrap gap-2 pt-1">
                {starters.map(x => (
                  <button key={x} onClick={() => { setMsgs(m => [...m, { from: "user", text: x }]); setTimeout(() => setMsgs(m => [...m, { from: "bot", text: reply(x) }]), 450); }}
                    className="text-[14px] px-3 py-1.5" style={{ border: "1px solid var(--line)" }}>{x}</button>
                ))}
              </div>
            )}
            <div ref={endRef} />
          </div>
          <div className="px-4 pt-3 pb-4 flex flex-col gap-3" style={{ borderTop: "1px solid var(--line)" }}>
            <div className="flex items-center gap-2">
              <input id="concierge-input" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()}
                placeholder="Escribe a Aurki…" className="field flex-1 min-w-0" style={{ fontSize: 16 }} />
              <button onClick={send} className="p-2" aria-label="Enviar"><Icon name="send2" size={17} /></button>
            </div>
            <button onClick={onOpenWizard} className="link-u self-start">Ver especialidades</button>
          </div>
        </div>
      )}
      <button onClick={() => setOpen(o => !o)} aria-label={open ? "Cerrar Aurki" : "Hablar con Aurki, el asistente virtual"}
        className="fixed z-50 flex items-center gap-3 rounded-full transition-transform hover:scale-105 md:pr-5"
        style={{ ...edge, bottom: "calc(env(safe-area-inset-bottom, 0px) + 20px)", background: "#182544", color: "#FBF7F1", boxShadow: "0 12px 30px -10px rgba(24,37,68,.55)" }}>
        <span className="relative">
          {open
            ? <span className="w-[52px] h-[52px] rounded-full flex items-center justify-center"><Icon name="x" size={20} /></span>
            : <AurkiAvatar size={52} />}
          {!open && <span className="absolute bottom-0.5 right-0.5 w-3 h-3 rounded-full" style={{ background: "#3FA36B", border: "2px solid #182544" }} />}
        </span>
        <span className="hidden md:inline text-[14px]" style={{ fontWeight: 700 }}>{open ? "Cerrar" : "Pregunta a Aurki"}</span>
      </button>
    </>
  );
}

/* ---------------------------------- MENÚ LATERAL ---------------------------------- */
function MenuDrawer({ onClose, onPick, onExplore, onNews, onOfertas, onJoin, onAccounts }) {
  const go = (fn) => () => { onClose(); fn(); };
  return (
    <div className="fixed inset-0 z-50 flex" style={{ background: "var(--overlay)" }} onClick={onClose}>
      <aside onClick={e => e.stopPropagation()} className="drawer w-full max-w-sm h-full overflow-y-auto scrollbar-none flex flex-col"
        style={{ background: "var(--bg)", padding: "max(22px, env(safe-area-inset-top, 0px)) 24px max(28px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px))" }}>
        <div className="flex items-center justify-between mb-10">
          <span className="flex items-center gap-3"><Logo size={30} /><span className="f-display text-[1.25rem] tracking-[0.3em]">LEXA LG</span></span>
          <button onClick={onClose} aria-label="Cerrar menú"><Icon name="x" size={20} /></button>
        </div>
        <nav className="flex flex-col">
          {[["Especialidades", onExplore], ["Despachos recomendados", onOfertas], ["Actualidad legal", onNews], ["Cuentas y precios", onAccounts], ["Únete como despacho", onJoin]].map(([l, fn]) => (
            <button key={l} onClick={go(fn)} className="f-display text-[1.7rem] text-left py-2.5 hover:opacity-60 transition-opacity">{l}</button>
          ))}
        </nav>
        <div className="eyebrow mt-10 mb-4">Por especialidad</div>
        <div className="flex flex-col">
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={go(() => onPick(c.id))} className="text-left text-[15.5px] py-2.5 flex items-center justify-between gap-3 muted hover:text-[var(--ink)]" style={{ borderTop: "1px solid var(--line)" }}>
              {c.label} <Icon name="chevronR" size={13} />
            </button>
          ))}
        </div>
      </aside>
    </div>
  );
}

/* ---------------------------------- NAV (logo centrado, buscador desplegable) ---------------------------------- */
function Nav({ onLogoClick, onOpenMenu, onExplore, onNews, onOpenFav, onOpenAuth, onContact, onRequireTerms, onSearch, termsAccepted, favCount, user }) {
  const [query, setQuery] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const inputRef = useRef(null);
  const openFirm = React.useContext(FirmSheetContext);
  const { results, alsoInterested } = useMemo(() => searchFirmsFn(query), [query]);

  const toggleSearch = () => {
    if (!termsAccepted) { onRequireTerms(); return; }
    setSearchOpen(o => !o);
  };
  useEffect(() => { if (searchOpen) inputRef.current?.focus(); }, [searchOpen]);
  useEffect(() => { if (!termsAccepted) setSearchOpen(false); }, [termsAccepted]);

  const submitSearch = () => {
    if (!termsAccepted) { onRequireTerms(); return; }
    if (!query.trim()) return;
    setSearchOpen(false);
    onSearch(query.trim());
  };
  const contact = (f) => { setSearchOpen(false); onContact(f); };

  return (
    <header className="sticky z-40" style={{ top: "env(safe-area-inset-top, 0px)", background: "color-mix(in srgb, var(--bg) 94%, transparent)", backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", borderBottom: "1px solid var(--line)" }}>
      <div className="gutter max-w-7xl mx-auto grid grid-cols-[1fr_auto_1fr] items-center h-[60px] md:h-[76px]">
        <div className="flex items-center gap-6">
          <button onClick={onOpenMenu} className="flex items-center gap-2.5" aria-label="Abrir menú">
            <Icon name="menu" size={20} />
            <span className="label hidden md:inline" style={{ fontSize: 12 }}>Menú</span>
          </button>
          <nav className="hidden lg:flex items-center gap-6">
            <button onClick={onExplore} className="label hover:opacity-60" style={{ fontSize: 12 }}>Especialidades</button>
            <button onClick={onNews} className="label hover:opacity-60" style={{ fontSize: 12 }}>Actualidad</button>
          </nav>
        </div>

        <button onClick={onLogoClick} className="flex items-center gap-2.5" aria-label="Lexa LG, inicio">
          <Logo size={30} />
          <span className="f-display text-[1.2rem] md:text-[1.5rem] tracking-[0.3em] leading-none">LEXA LG</span>
        </button>

        <div className="flex items-center justify-end gap-4 md:gap-5">
          <button onClick={toggleSearch} aria-label="Buscar" aria-expanded={searchOpen}><Icon name={searchOpen ? "x" : "search"} size={18} /></button>
          <button onClick={onOpenFav} className="relative" aria-label="Favoritos">
            <Icon name="star" size={18} />
            {favCount > 0 && <span className="absolute -top-1.5 -right-2 text-[9px] rounded-full w-4 h-4 flex items-center justify-center" style={{ background: "var(--ink)", color: "var(--on-ink)" }}>{favCount}</span>}
          </button>
          <button onClick={onOpenAuth} className="flex items-center gap-2" aria-label={user ? user.name : "Acceder"}>
            <Icon name="user" size={18} />
            <span className="label hidden md:inline" style={{ fontSize: 12 }}>{user ? user.name : "Acceder"}</span>
          </button>
        </div>
      </div>

      {searchOpen && (
        <div className="gutter pb-5" style={{ borderTop: "1px solid var(--line)", background: "var(--bg)" }}>
          <div className="max-w-3xl mx-auto pt-5">
            <div className="flex items-center gap-3" style={{ borderBottom: "1px solid var(--ink)" }}>
              <Icon name="search" size={16} className="muted" />
              <input ref={inputRef} id="nav-search" value={query} onChange={e => setQuery(e.target.value)}
                onKeyDown={e => e.key === "Enter" && submitSearch()}
                placeholder="Bufete o tema: impuestos, visado, herencia…"
                className="flex-1 min-w-0 bg-transparent outline-none py-3 text-[16px]" style={{ color: "var(--ink)" }} />
              {query && <button onClick={submitSearch} className="link-u shrink-0">Buscar</button>}
            </div>
            {query.trim() && (
              <div className="max-h-[58vh] overflow-y-auto scrollbar-none mt-3">
                {results.length === 0 ? (
                  <p className="text-[15px] muted py-4">Sin resultados. Prueba con otro nombre o describe tu caso.</p>
                ) : results.map(f => (
                  <div key={f.name} className="flex items-center gap-3.5 py-3" style={{ borderBottom: "1px solid var(--line)" }}>
                    <FirmCrest name={f.name} size={44} />
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <button onClick={() => { setSearchOpen(false); openFirm(f, { query }); }} className="f-display text-[1.1rem] truncate text-left hover:opacity-70">{f.name}</button>
                        {f.promoted && <span className="tag-promo shrink-0">Anuncio</span>}
                      </div>
                      <div className="text-[13.5px] muted">{f.city} · <Fee tier={f.priceTier} /></div>
                    </div>
                    <button onClick={() => { setSearchOpen(false); openFirm(f, { query }); }} className="link-u shrink-0">Ver ficha</button>
                  </div>
                ))}
                {alsoInterested.length > 0 && (
                  <div className="pt-5">
                    <div className="eyebrow mb-2">También te puede interesar</div>
                    {alsoInterested.map(f => (
                      <div key={f.name} className="flex items-center gap-3 py-2">
                        <FirmCrest name={f.name} size={30} />
                        <div className="text-[15.5px] f-display truncate">{f.name}</div>
                      </div>
                    ))}
                  </div>
                )}
                <button onClick={submitSearch} className="btn btn-outline btn-sm w-full mt-5">Ver todos los resultados</button>
              </div>
            )}
          </div>
        </div>
      )}
    </header>
  );
}

/* ---------------------------------- APP ---------------------------------- */
function App() {
  const [page, setPage] = useState("home"); // home | especialidades | busqueda
  const [termsAccepted, setTermsAccepted] = useState(false);
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");
  // Flujo de contacto: plan (precio visible) → consentimiento → datos → pago (si es de pago)
  const [contact, setContact] = useState(null); // { firm, stage: plan|policy|form|pay, choice, who }
  const [account, setAccount] = useLocalState("lexa_account", "free");
  const [plansTab, setPlansTab] = useState(null); // abre el selector de cuentas
  const [checkout, setCheckout] = useState(null); // id de la cuenta a contratar
  const choosePlan = (id) => { setPlansTab(null); if (ACCOUNTS[id].price) setCheckout(id); else setAccount("free"); };
  const [trialEnds, setTrialEnds] = useLocalState("lexa_trial_ends", null);
  const confirmAccount = (id, ends) => { setAccount(id); if (ends) setTrialEnds(ends); };
  const accountCtx = useMemo(() => ({ account, openPlans: (tab) => setPlansTab(tab || "personal"), trialUsed: !!trialEnds, trialEnds }), [account, trialEnds]);
  const [showAuth, setShowAuth] = useState(false);
  const [showFav, setShowFav] = useState(false);
  const [showMenu, setShowMenu] = useState(false);
  const [showJoinFirm, setShowJoinFirm] = useState(false);
  const [sheet, setSheet] = useState(null); // { firm, ctx }
  const openFirm = useCallback((firm, ctx) => setSheet({ firm, ctx: ctx || {} }), []);
  const [user, setUser] = useLocalState("lexa_user", null);
  const [favorites, setFavorites] = useLocalState("lexa_favorites", []);

  const toggleFav = (name) => {
    setFavorites(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
  };

  const openContact = (firm) => setContact({ firm, stage: "policy" });
  const closeContact = () => setContact(null);
  const nextStage = (patch) => setContact(c => ({ ...c, ...patch }));

  const toTop = () => window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  const goEspecialidades = () => {
    setPage("especialidades");
    setSelectedCategory(null);
    toTop();
  };
  const goHome = () => {
    setPage("home");
    setSelectedCategory(null);
    toTop();
  };
  const goSection = (id) => {
    setPage("home");
    setSelectedCategory(null);
    setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: "smooth" }), 80);
  };
  const goNews = () => goSection("actualidad");
  const pickCategory = (id) => {
    setSelectedCategory(id);
    setPage("especialidades");
    toTop();
  };
  const runSearch = (q) => {
    setSearchQuery(q);
    setPage("busqueda");
    toTop();
  };
  // Búsqueda por caso desde la portada: si aún no se aceptaron las condiciones, se aceptan primero y luego se busca
  const [pendingQuery, setPendingQuery] = useState(null);
  const caseSearch = (q) => {
    if (!termsAccepted) { setPendingQuery(q); goEspecialidades(); return; }
    runSearch(q);
  };
  const acceptTerms = () => {
    setTermsAccepted(true);
    if (pendingQuery) { const q = pendingQuery; setPendingQuery(null); runSearch(q); }
  };
  const logout = () => {
    setUser(null);
    setShowFav(false);
  };

  const BackHome = () => (
    <div className="gutter pt-8">
      <div className="max-w-7xl mx-auto">
        <button onClick={goHome} className="link"><Icon name="chevronL" size={13} /> Inicio</button>
      </div>
    </div>
  );

  return (
    <FirmSheetContext.Provider value={openFirm}>
    <AccountContext.Provider value={accountCtx}>
    <div className="min-h-screen flex flex-col">
      <div className="gutter py-2.5 text-center text-[12.5px] tracking-[0.12em] uppercase" style={{ background: "#182544", color: "#E9E3D8" }}>
        Primera consulta confidencial<span className="hidden sm:inline"> <span style={{ color: "#D1A54A" }}>·</span> Sede en Bilbao</span>
      </div>
      <Nav onLogoClick={goHome} onOpenMenu={() => setShowMenu(true)} onExplore={goEspecialidades} onNews={goNews} onOpenFav={() => setShowFav(true)} onOpenAuth={() => user ? setShowFav(true) : setShowAuth(true)} onContact={openContact} onRequireTerms={goEspecialidades} onSearch={runSearch} termsAccepted={termsAccepted} favCount={favorites.length} user={user} />

      <main className="flex-1">
        {page === "home" ? (
          <>
            <Hero onCase={caseSearch} />
            <Promises />
            <HomeCategories onPick={pickCategory} onExplore={goEspecialidades} />
            <NewsFeed />
            <OfertasBufetes favorites={favorites} toggleFav={toggleFav} onContact={openContact} />
            <AccountsSection current={account} onChoose={choosePlan} />
            <GuaranteesSection />
            <JoinFirmsSection onOpen={() => setShowJoinFirm("pro")} />
            <FirmPlansSection onJoin={setShowJoinFirm} />
          </>
        ) : page === "busqueda" ? (
          <>
            <BackHome />
            <SearchResultsPage query={searchQuery} favorites={favorites} toggleFav={toggleFav} onContact={openContact} onPickCategory={pickCategory} />
          </>
        ) : (
          <>
            <BackHome />
            {!termsAccepted ? (
              <TermsGate onAccept={acceptTerms} />
            ) : selectedCategory ? (
              <CategoryResults categoryId={selectedCategory} favorites={favorites} toggleFav={toggleFav} onBack={() => setSelectedCategory(null)} onContact={openContact} />
            ) : (
              <CategoryGrid onPick={pickCategory} />
            )}
          </>
        )}
      </main>

      <footer className="gutter pt-16" style={{ background: "var(--surface-2)", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 96px)" }}>
        <div className="max-w-7xl mx-auto">
          <div className="text-center mb-14">
            <div className="flex justify-center mb-4"><Logo size={48} /></div>
            <div className="f-display text-[1.8rem] tracking-[0.32em] pl-[0.32em]">LEXA LG</div>
            <div className="eyebrow justify-center mt-3">Legal Group · desde 2004</div>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-10 text-[15px]">
            <div className="col-span-2 md:col-span-1">
              <div className="label mb-4">La casa</div>
              <p className="muted leading-relaxed max-w-xs">Plataforma de intermediación que conecta clientes internacionales con despachos seleccionados en España.</p>
            </div>
            <div>
              <div className="label mb-4">Especialidades</div>
              <div className="flex flex-col gap-2.5 items-start">
                {CATEGORIES.slice(0, 5).map(c => <button key={c.id} onClick={() => pickCategory(c.id)} className="muted hover:text-[var(--ink)] text-left">{c.label.split(/,| &/)[0]}</button>)}
              </div>
            </div>
            <div>
              <div className="label mb-4">&nbsp;</div>
              <div className="flex flex-col gap-2.5 items-start">
                {CATEGORIES.slice(5).map(c => <button key={c.id} onClick={() => pickCategory(c.id)} className="muted hover:text-[var(--ink)] text-left">{c.label.split(/,| &/)[0]}</button>)}
              </div>
            </div>
            <div className="col-span-2 md:col-span-1">
              <div className="label mb-4">Sede</div>
              <p className="muted leading-relaxed">Bilbao, Bizkaia</p>
              <div className="flex flex-col items-start gap-3 mt-6">
                <button onClick={() => goSection("garantias")} className="link-u">Plazos y garantías</button>
                <button onClick={() => goSection("cuentas")} className="link-u">Cuentas y precios</button>
                <button onClick={() => goSection("planes-despachos")} className="link-u">Planes para despachos</button>
              </div>
            </div>
          </div>
          <div className="mt-14 pt-6 flex flex-col md:flex-row justify-between gap-3 text-[13px] muted" style={{ borderTop: "1px solid var(--line)" }}>
            <span>© Lexa LG — Legal Group</span>
            <span>Prototipo demostrativo. Los despachos y datos mostrados son ficticios.</span>
          </div>
        </div>
      </footer>

      {contact?.stage === "policy" && <ConsentModal onClose={closeContact} onAccept={() => nextStage({ stage: "form" })} />}
      {contact?.stage === "form" && <ContactFormModal firm={contact.firm} account={account} onClose={closeContact} />}
      {plansTab && <PlansModal initialTab={plansTab} current={account} onChoose={choosePlan} onClose={() => setPlansTab(null)} />}
      {checkout && <CheckoutModal id={checkout} onConfirm={confirmAccount} onClose={() => setCheckout(null)} />}
      {showMenu && <MenuDrawer onClose={() => setShowMenu(false)} onPick={pickCategory} onExplore={goEspecialidades} onNews={goNews} onOfertas={() => goSection("ofertas")} onAccounts={() => goSection("cuentas")} onJoin={() => setShowJoinFirm(true)} />}
      {showAuth && <AuthModal onClose={() => setShowAuth(false)} onLogin={(u) => { setUser(u); setShowAuth(false); }} />}
      {showFav && <FavoritesPanel favorites={favorites} toggleFav={toggleFav} onClose={() => setShowFav(false)} user={user} onLogout={logout} />}
      {showJoinFirm && <JoinFirmModal initialPlan={typeof showJoinFirm === "string" ? showJoinFirm : "pro"} onClose={() => setShowJoinFirm(false)} />}

      {sheet && (
        <FirmSheet firm={sheet.firm} ctx={sheet.ctx} onClose={() => setSheet(null)}
          onSwitch={(f) => setSheet(s => ({ ...s, firm: f }))}
          onContact={(f) => { setSheet(null); openContact(f); }}
          isFav={favorites.includes(sheet.firm.name)} onToggleFav={toggleFav} />
      )}

      <Concierge onOpenWizard={goEspecialidades} />
    </div>
    </AccountContext.Provider>
    </FirmSheetContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
