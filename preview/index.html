<title>Lexa LG en iPhone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: el iPhone ocupa el centro a la altura de la ventana; a un lado, nombre y controles mínimos. */
  :root{
    --bg:#EFEAE3; --panel:#F7F4EF; --ink:#1F1B17; --ink-2:#6F675F; --line:rgba(31,27,23,.14);
    --frame:#1A1816; --frame-edge:#4A4540;
    --f-display:'Cormorant Garamond', Georgia, serif; --f-body:'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0F0E0C; --panel:#191714; --ink:#EEE8DE; --ink-2:#A39A8F; --line:rgba(238,232,222,.14); --frame:#050505; --frame-edge:#3A3631; color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --bg:#0F0E0C; --panel:#191714; --ink:#EEE8DE; --ink-2:#A39A8F; --line:rgba(238,232,222,.14); --frame:#050505; --frame-edge:#3A3631; color-scheme:dark; }
  html, body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-weight:300; overflow:hidden; }
  .stage{ height:100%; display:flex; align-items:center; justify-content:center; gap:56px;
    padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .side{ width:240px; display:flex; flex-direction:column; gap:28px; }
  .brand{ font-family:var(--f-display); font-size:30px; letter-spacing:.32em; line-height:1; }
  .eyebrow{ font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-2); }
  .side p{ font-size:13.5px; line-height:1.6; color:var(--ink-2); margin:0; }
  .seg{ display:flex; border:1px solid var(--line); }
  .seg button{ flex:1; padding:10px 0; background:transparent; border:0; color:var(--ink-2); font:inherit; font-size:10px; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; }
  .seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
  .actions{ display:flex; flex-direction:column; gap:10px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 0; border:1px solid var(--ink); color:var(--ink); background:transparent; font:inherit; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; text-decoration:none; }
  .btn:hover{ background:var(--ink); color:var(--bg); }
  .stamp{ font-size:11.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  :focus-visible{ outline:1px solid var(--ink); outline-offset:3px; }

  /* iPhone 15 Pro: pantalla 393 × 852 pt */
  .phone-box{ flex-shrink:0; position:relative; }
  .phone{ position:absolute; top:0; left:0; width:417px; height:876px; transform-origin:top left;
    border-radius:64px; background:var(--frame); padding:12px;
    box-shadow: 0 0 0 1.5px var(--frame-edge), 0 0 0 7px color-mix(in srgb, var(--frame-edge) 55%, var(--bg)), 0 50px 90px -30px rgba(0,0,0,.45); }
  .phone::before, .phone::after{ content:""; position:absolute; width:4px; border-radius:2px; background:color-mix(in srgb, var(--frame-edge) 70%, var(--bg)); }
  .phone::before{ left:-10px; top:180px; height:64px; box-shadow:0 84px 0 color-mix(in srgb, var(--frame-edge) 70%, var(--bg)); }
  .phone::after{ right:-10px; top:220px; height:100px; }
  .screen{ position:relative; width:393px; height:852px; border-radius:52px; overflow:hidden; background:#FBF9F6; }
  .status{ position:absolute; inset:0 0 auto; height:54px; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:6px 30px 0 46px; font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-weight:600; font-size:16px; color:#111; transition:background-color .3s, color .3s; }
  .island{ position:absolute; top:11px; left:50%; transform:translateX(-50%); width:124px; height:36px; border-radius:20px; background:#000; z-index:4; }
  .status svg{ display:block; }
  .icons{ display:flex; align-items:center; gap:6px; }
  iframe{ position:absolute; top:54px; left:0; width:393px; height:798px; border:0; background:transparent; display:block; }
  .home{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#111; opacity:.85; z-index:3; pointer-events:none; transition:background-color .3s; }

  @media (max-width:760px){ .side{ display:none; } .stage{ gap:0; } }
</style>

<div class="stage">
  <aside class="side">
    <div>
      <div class="eyebrow">Vista previa en vivo</div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:16px">
        <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#182544"/><path d="M31 21V68.5H64" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="66" cy="34" r="9.5" fill="none" stroke="#D1A54A" stroke-width="4.4"/><path d="M73 41L81.5 49.5" stroke="#D1A54A" stroke-width="4.8" stroke-linecap="round"/></svg>
        <div class="brand">LEXA LG</div>
      </div>
    </div>
    <p>La web dentro de un iPhone 15 Pro, a su tamaño real de 393 × 852. Se actualiza sola cada vez que se publica un cambio; puedes navegar, buscar y abrir formularios como en el móvil.</p>
    <div>
      <div class="eyebrow" style="margin-bottom:10px">Apariencia</div>
      <div class="seg" role="group" aria-label="Apariencia del iPhone">
        <button type="button" id="t-light" data-t="light">Claro</button>
        <button type="button" id="t-dark" data-t="dark">Oscuro</button>
        <button type="button" id="t-auto" data-t="auto">Sistema</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="reload">Recargar</button>
      <a class="btn" href="app.html" target="_blank" rel="noopener">Abrir a pantalla completa</a>
    </div>
    <div class="stamp" id="stamp"></div>
  </aside>

  <div class="phone-box" id="box">
    <div class="phone" id="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="status" id="status">
          <span id="clock">9:41</span>
          <span class="icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4 10.3 10.3 0 0 0 .8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.6c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 4a7 7 0 0 0-4.8 1.9l1.2 1.3c1-.9 2.2-1.4 3.6-1.4zm0 3.6c.5 0 1 .2 1.3.5L8 11.4 6.7 9.9c.3-.3.8-.5 1.3-.5z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <iframe id="app" src="app.html" title="Lexa LG en iPhone"></iframe>
        <div class="home" id="home"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var W = 417, H = 876;
  var box = document.getElementById('box'), phone = document.getElementById('phone');
  function fit(){
    var s = Math.min(1, (window.innerHeight - 40) / H, (window.innerWidth - 32) / W);
    phone.style.transform = 'scale(' + s + ')';
    box.style.width = (W * s) + 'px'; box.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  var frame = document.getElementById('app');
  var theme = 'auto';
  try { theme = localStorage.getItem('lexa-preview-theme') || 'auto'; } catch (e) {}

  function luminance(rgb){
    var m = rgb && rgb.match(/\d+(\.\d+)?/g); if (!m) return 1;
    return (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255;
  }
  function syncChrome(){
    var doc; try { doc = frame.contentDocument; } catch (e) {}
    if (!doc || !doc.body) return;
    var bg = getComputedStyle(doc.body).backgroundColor;
    var status = document.getElementById('status');
    var dark = luminance(bg) < 0.5;
    status.style.backgroundColor = bg;
    status.style.color = dark ? '#F5F2EE' : '#111';
    document.getElementById('home').style.backgroundColor = dark ? '#F5F2EE' : '#111';
    frame.parentNode.style.backgroundColor = bg;
  }
  function apply(){
    ['light','dark','auto'].forEach(function(t){ document.getElementById('t-' + t).setAttribute('aria-pressed', String(t === theme)); });
    var doc; try { doc = frame.contentDocument; } catch (e) {}
    if (doc && doc.documentElement) {
      if (theme === 'auto') doc.documentElement.removeAttribute('data-theme');
      else doc.documentElement.setAttribute('data-theme', theme);
    }
    setTimeout(syncChrome, 30);
  }
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      theme = b.getAttribute('data-t');
      try { localStorage.setItem('lexa-preview-theme', theme); } catch (e) {}
      apply();
    });
  });
  frame.addEventListener('load', function(){
    apply();
    var n = new Date();
    document.getElementById('stamp').textContent = 'Cargada a las ' + n.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    setTimeout(syncChrome, 600); setTimeout(syncChrome, 2000);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ setTimeout(syncChrome, 30); });
  document.getElementById('reload').addEventListener('click', function(){
    try { frame.contentWindow.location.reload(); } catch (e) { frame.src = 'app.html?' + Date.now(); }
  });
  function tick(){ var n = new Date(); document.getElementById('clock').textContent = n.getHours() + ':' + String(n.getMinutes()).padStart(2, '0'); }
  tick(); setInterval(tick, 15000);
  apply();
})();
</script>
