<style>
  /* Layout: banda oscura tipo "carpeta de expediente" arriba (nav + portada), papel claro debajo; sellos de lacre como firma visual. */
  :root{
    --bg:#F2F1EC;
    --surface:#FFFFFF;
    --surface-2:#E9E8E1;
    --ink:#15212C;
    --ink-2:#56616C;

    --band-ink-2:#A7B1BB;
    --band-line:rgba(237,232,222,.15);
    --lacre:#9A2F2B;
    --lacre-hover:#7E231F;
    --on-lacre:#FFF8F0;
    --brass:#8E6A2E;
    --brass-band:#D4B06E;
    --shadow:0 1px 2px rgba(21,33,44,.05), 0 18px 40px -18px rgba(21,33,44,.25);

    --f-body:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;

      --bg:#0D141B; --surface:#141E28; --surface-2:#1C2834; --ink:#E8E4DB; --ink-2:#9AA5B0;
      --line:rgba(232,228,219,.12); --band:#080F15; --band-ink:#EDE8DE; --band-ink-2:#A7B1BB;
      --band-line:rgba(237,232,222,.13); --lacre:#C0463F; --lacre-hover:#D2574F; --on-lacre:#FFF8F0;
      --brass:#D0AA68; --brass-band:#D4B06E;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 44px -18px rgba(0,0,0,.7); --overlay:rgba(0,0,0,.65);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D141B; --surface:#141E28; --surface-2:#1C2834; --ink:#E8E4DB; --ink-2:#9AA5B0;
    --line:rgba(232,228,219,.12); --band:#080F15; --band-ink:#EDE8DE; --band-ink-2:#A7B1BB;
    --band-line:rgba(237,232,222,.13); --lacre:#C0463F; --lacre-hover:#D2574F; --on-lacre:#FFF8F0;

  html{ scroll-behavior:smooth; scroll-padding-top:calc(72px + env(safe-area-inset-top, 0px)); }
  *{ box-sizing:border-box; }

  body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:45; background:var(--band); }
  ::selection{ background:var(--lacre); color:var(--on-lacre); }
  button{ color:inherit; }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; border-radius:3px; }

  .gutter{ padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width:768px){ .gutter{ padding-left:max(40px, env(safe-area-inset-left, 0px)); padding-right:max(40px, env(safe-area-inset-right, 0px)); } }

  .f-display{ font-family:var(--f-display); font-weight:400; letter-spacing:-.005em; text-wrap:balance; }
  .f-mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass); display:flex; align-items:center; gap:8px; }
  .muted{ color:var(--ink-2); }
  .h-section{ font-family:var(--f-display); font-weight:400; font-size:clamp(1.9rem, 3.4vw, 2.75rem); line-height:1.08; text-wrap:balance; }

  .band{ background:var(--band); color:var(--band-ink); }
  .band .eyebrow{ color:var(--brass-band); }
  .hero-title{ font-size:clamp(2.6rem, 6.2vw, 4.75rem); line-height:1.02; }
  .hero-glow{ position:absolute; inset:0; pointer-events:none;

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:500; padding:12px 22px; border-radius:4px; border:1px solid transparent; transition:background-color .2s, color .2s, border-color .2s, transform .2s; cursor:pointer; white-space:nowrap; }
  .btn-primary{ background:var(--lacre); color:var(--on-lacre); }

  .btn-outline{ border-color:var(--line); color:var(--ink); background:transparent; }
  .btn-outline:hover{ border-color:var(--ink); }
  .btn-band{ border-color:var(--band-line); color:var(--band-ink); }
  .btn-band:hover{ border-color:var(--brass-band); color:var(--brass-band); }
  .btn-sm{ padding:8px 14px; font-size:12.5px; }
  .link{ color:var(--brass); display:inline-flex; align-items:center; gap:6px; font-size:14px; }
  .link:hover{ color:var(--ink); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:6px; }
  .card-hover{ transition:box-shadow .25s, transform .25s, border-color .25s; }
  .card-hover:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
  .chip{ font-size:11.5px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; color:var(--ink-2); }
  .pill-lacre{ font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--lacre); color:var(--on-lacre); }
  .tag-promo{ font-family:var(--f-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass); }

  .ledger{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .ledger > div{ padding:10px 0 10px 12px; border-left:1px solid var(--line); min-width:0; }
  .ledger > div:first-child{ border-left:0; padding-left:0; }
  .ledger dt{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
  .ledger dd{ margin:3px 0 0; font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fee-off{ color:var(--line); }

  .deed{ background:var(--surface); color:var(--ink); border-radius:6px; box-shadow:0 30px 60px -30px rgba(0,0,0,.6); position:relative; }
  .deed::before{ content:""; position:absolute; inset:10px; border:1px solid var(--line); border-radius:3px; pointer-events:none; }
  .index-row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 4px; border-bottom:1px dashed var(--line); transition:color .2s, padding .2s; }
  .index-row:hover{ color:var(--lacre); padding-left:10px; }
  .index-row .lead{ flex:1; min-width:16px; border-bottom:1px dotted var(--ink-2); opacity:.45; transform:translateY(-3px); }

  .field-label{ display:block; font-size:11.5px; letter-spacing:.04em; color:var(--ink-2); }
  .field{ width:100%; background:transparent; border:0; border-bottom:1px solid var(--line); padding:8px 0; font:inherit; font-size:15px; color:var(--ink); outline:none; border-radius:0; }
  .field:focus{ border-bottom-color:var(--brass); }
  .field::placeholder{ color:var(--ink-2); opacity:.7; }
  textarea.field{ border:1px solid var(--line); padding:10px 12px; border-radius:4px; resize:none; }
  textarea.field:focus{ border-color:var(--brass); }
  select.field option{ background:var(--surface); color:var(--ink); }

  .modal-wrap{ position:fixed; inset:0; z-index:60; background:var(--overlay); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
    padding:max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .modal{ background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); width:100%; max-height:88vh; overflow-y:auto; padding:32px 28px; position:relative; animation:pop .22s ease-out; }
  @keyframes pop{ from{ transform:translateY(8px) scale(.985); } to{ transform:none; } }
  .icon-disc{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--lacre); flex-shrink:0; }

  .nav-search{ background:color-mix(in srgb, var(--band-ink) 7%, transparent); border:1px solid var(--band-line); color:var(--band-ink); }
  .nav-search::placeholder{ color:var(--band-ink-2); }
  .nav-search:focus{ border-color:var(--brass-band); outline:none; }

  .scrollbar-none::-webkit-scrollbar{ display:none; }
  .scrollbar-none{ -ms-overflow-style:none; scrollbar-width:none; }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; scroll-behavior:auto !important; }
  }
</style>

/* ---------------------------------- FUZZY SEARCH ---------------------------------- */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
    }
  }
  return d[m][n];
}

function fuzzyScore(query, target) {
  const q = query.toLowerCase().trim();
  const t = target.toLowerCase();
  if (!q) return 0;
  if (t === q) return 100;
  if (t.startsWith(q)) return 92;
  if (t.includes(q)) return 80;
  const words = t.split(/[\s&]+/).filter(Boolean);
  if (words.some(w => w.startsWith(q))) return 70;
  const dist = Math.min(...words.map(w => levenshtein(q, w)));
  const ratio = 1 - dist / Math.max(q.length, 4);
  return Math.max(0, Math.round(ratio * 55));
}

// Búsqueda combinada: por nombre de bufete (difusa) o por caso/problema descrito (por especialidad)
function caseScore(query, firm) {
  const m = query.toLowerCase();
  let score = 0;
  Object.entries(TOPIC_SIGNALS).forEach(([catId, t]) => {
    const hits = t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0);
    if (hits > 0 && firm.focus.includes(catId)) score += hits * 18;
  });
  const descWords = firm.desc.toLowerCase();
  query.toLowerCase().split(/\s+/).filter(w => w.length > 3).forEach(w => { if (descWords.includes(w)) score += 4; });
  return score;
}

function combinedScore(query, firm) {
  return Math.max(fuzzyScore(query, firm.name), caseScore(query, firm));
}

function searchFirmsFn(query) {
  if (!query.trim()) return { results: [], alsoInterested: [] };
  const scored = FIRMS.map(f => ({ f, score: combinedScore(query, f) })).filter(r => r.score > 12);
  const results = scored
    .sort((a, b) => (b.f.promoted - a.f.promoted) || (b.score - a.score))
    .slice(0, 6)
    .map(r => r.f);
  let alsoInterested = [];
  if (results.length > 0) {
    const anchor = results[0];
    const shownNames = new Set(results.map(f => f.name));
    alsoInterested = FIRMS
      .filter(f => !shownNames.has(f.name) && f.focus.some(cat => anchor.focus.includes(cat)))
      .map(f => ({ f, score: (f.promoted ? 30 : 0) + (4 - f.priceTier) * 10 + (f.since < 2005 ? 8 : 0) }))
      .sort((a, b) => (b.f.promoted - a.f.promoted) || (b.score - a.score))
      .slice(0, 3)
      .map(r => r.f);
  }
  return { results, alsoInterested };
}

function relatedCategoriesForQuery(query) {
  const m = query.toLowerCase();
  return Object.entries(TOPIC_SIGNALS)
    .map(([id, t]) => ({ id, hits: t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0) }))
    .filter(r => r.hits > 0)
    .sort((a, b) => b.hits - a.hits)
    .map(r => CATEGORIES.find(c => c.id === r.id))
    .filter(Boolean);
}


/* ---------------------------------- SELLO DE LACRE (imagen distintiva de cada bufete) ---------------------------------- */
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
const SEAL_PALETTES = [
  ["#8E2B27", "#F1D9BE"], ["#1E3A4C", "#E2CDA4"], ["#3D4A2C", "#E8D9AE"], ["#5E3A1A", "#F2DFB8"], ["#2B2440", "#E4D2B0"],
];
function sealPath(r0, amp, lobes) {
  const N = lobes * 8;
  let d = "";
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = r0 + amp * Math.cos(a * lobes);
    d += (i ? "L" : "M") + (32 + r * Math.cos(a)).toFixed(2) + " " + (32 + r * Math.sin(a)).toFixed(2);
  }
  return d + "Z";
}
function FirmCrest({ name, size = 56 }) {
  const h = hashStr(name);
  const [wax, emboss] = SEAL_PALETTES[name === "Lexa LG" ? 0 : h % SEAL_PALETTES.length];
  const initials = name.split(/\s+/).filter(w => w.length > 1 || /[A-ZÁÉÍÓÚÑ]/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const lobes = 13 + (h % 6);
  const path = useMemo(() => sealPath(29.5, 1.5, lobes), [lobes]);
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" className="shrink-0" aria-hidden="true">
      <path d={path} fill={wax} />
      <ellipse cx="25" cy="21" rx="14" ry="9" fill="#FFFFFF" opacity="0.10" transform="rotate(-30 25 21)" />
      <circle cx="32" cy="32" r="23.5" fill="none" stroke={emboss} strokeWidth="0.9" opacity="0.55" />
      <circle cx="32" cy="32" r="20.5" fill="none" stroke={emboss} strokeWidth="0.7" opacity="0.35" strokeDasharray="1 2.4" />
      <text x="32" y="38.5" textAnchor="middle" fontFamily="Gloock, Georgia, serif" fontSize="17" fill={emboss}>{initials}</text>
    </svg>
  );
}

/* ---------------------------------- REFINAR EN 2 PREGUNTAS (auto-avance) ---------------------------------- */
function QuickRefine({ categoryId, onComplete, onCancel }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const q1 = QUESTIONS.find(q => q.cat === categoryId && q.type === "select");
  const steps = [
    { key: "q1", text: q1.text, options: q1.options },
    { key: "q2", text: "¿Qué urgencia tiene tu caso?", options: ["Inmediata (< 1 mes)", "Próximos meses", "Sin prisa, explorando opciones"] },
  ];
  const current = steps[step];

  const choose = (opt) => {
    const next = { ...answers, [current.key]: opt };
    setAnswers(next);
    if (step < steps.length - 1) setStep(step + 1);
    else onComplete(next);
  };
  const back = () => { if (step > 0) setStep(step - 1); else onCancel(); };

  return (
    <div className="card p-6 md:p-8 mb-10" style={{ boxShadow: "var(--shadow)" }}>
      <div className="flex items-center justify-between gap-4 mb-6">
        <div className="eyebrow">Afinar resultado · <span className="f-mono">{step + 1}/{steps.length}</span></div>
        <button onClick={onCancel} className="muted hover:opacity-70" aria-label="Cerrar"><Icon name="x" size={16} /></button>
      </div>
      <div className="grid grid-cols-2 gap-1.5 mb-7">
        {steps.map((s, i) => <div key={s.key} className="h-[3px] rounded-full" style={{ background: i <= step ? "var(--lacre)" : "var(--surface-2)" }} />)}
      </div>
      <h3 className="f-display text-[1.6rem] leading-tight mb-6">{current.text}</h3>
      <div className="grid sm:grid-cols-2 gap-3 mb-6">
        {current.options.map(opt => (
          <button key={opt} onClick={() => choose(opt)}
            className="text-left px-5 py-4 rounded border text-[14.5px] flex items-center justify-between gap-3 transition-colors hover:bg-[var(--surface-2)]"
            style={{ borderColor: "var(--line)" }}>
            {opt} <Icon name="chevronR" size={14} className="muted shrink-0" />
          </button>
        ))}
      </div>
      <button onClick={back} className="link muted"><Icon name="chevronL" size={15} /> Atrás</button>
    </div>
  );
}

/* ---------------------------------- HELPERS ---------------------------------- */
function useLocalState(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }, [key, val]);
  return [val, setVal];
}

function computeMatches(primaryCat, refineAnswers, pool) {
  const firms = pool || FIRMS;
  const q1 = (refineAnswers?.q1 || "").toLowerCase();
  const q2 = refineAnswers?.q2 || "";
  return firms.map(firm => {
    const sizeNum = parseInt(firm.size) || 20;
    let score = 40;
    if (primaryCat && firm.focus.includes(primaryCat)) score += 10;
    if (firm.promoted) score += 8;
    if (q1 && firm.tags.some(t => t === q1 || q1.includes(t) || t.includes(q1))) score += 40;
    if (q2.startsWith("Inmediata")) {
      score += (sizeNum < 20 ? 16 : 0) + (firm.priceTier <= 2 ? 6 : 0);
    } else if (q2.startsWith("Sin prisa")) {
      score += (firm.since < 2005 ? 16 : 0) + (firm.priceTier >= 3 ? 6 : 0);
    } else if (q2) {
      score += 8;
    }
    score += (firm.since < 2000 ? 6 : firm.since < 2012 ? 3 : 0);
    return { ...firm, match: score };
  }).sort((a, b) => b.match - a.match);
}

const URGENT_WORDS = ["urgente","urgencia","cuanto antes","ya mismo","rápido","rapido","inmediato"];
const GREETINGS = ["hola","buenas","hey","buenos días","buenos dias","buenas tardes"];

function reply(msg) {
  const m = msg.toLowerCase();

  if (GREETINGS.some(g => m.includes(g)) && m.length < 40)
    return "Buenas tardes. Cuéntame brevemente qué necesitas — por ejemplo 'quiero comprar una casa en Bilbao' o 'necesito un visado de nómada digital' — y te digo exactamente qué diagnóstico abrir.";

  const scores = Object.entries(TOPIC_SIGNALS).map(([id, t]) => ({
    id, reply: t.reply, score: t.words.reduce((s, w) => s + (m.includes(w) ? 1 : 0), 0),
  })).sort((a, b) => b.score - a.score);

  const top = scores[0];
  const isUrgent = URGENT_WORDS.some(w => m.includes(w));

  if (top.score > 0) {
    const urgentNote = isUrgent ? " Como mencionas urgencia, márcalo también en la pregunta de plazos del diagnóstico: filtramos a los despachos con disponibilidad inmediata." : "";
    return top.reply + urgentNote;
  }

  if (m.includes("precio") || m.includes("coste") || m.includes("honorario") || m.includes("cuánto cuesta") || m.includes("cuanto cuesta"))
    return "Los honorarios varían según el despacho y la complejidad del caso — algunos trabajan a tarifa fija y otros por horas. Si completas el diagnóstico, cada bufete recomendado te lo detalla directamente al contactar.";

  if (m.length < 12)
    return "Cuéntame un poco más — ¿tu duda es sobre una propiedad, un visado, tu familia, tu empresa, impuestos, tu trabajo o un conflicto con alguien?";

  return "Gracias por el detalle. No he identificado con seguridad la rama legal exacta — ¿se trata de propiedad, inmigración, familia, empresa, impuestos, patrimonio, trabajo, un asunto penal, tecnología o un pleito? También puedes describir tu caso directamente en el buscador de arriba.";
}

    setFavorites(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
  };

  const openContact = (firm) => { setContactFirm(firm); setContactStage("policy"); };
  const closeContact = () => { setContactFirm(null); setContactStage("policy"); };

  const toTop = () => window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  const goEspecialidades = () => {
    setPage("especialidades");
    setSelectedCategory(null);
    toTop();
  };
  const goHome = () => {
    setPage("home");
    setSelectedCategory(null);
    toTop();
  };
  const goNews = () => {
    setPage("home");
    setSelectedCategory(null);
    setTimeout(() => document.getElementById("actualidad")?.scrollIntoView({ behavior: "smooth" }), 80);
  };
  const pickCategory = (id) => {
    setSelectedCategory(id);
    setPage("especialidades");
    toTop();
  };
  const runSearch = (q) => {
    setSearchQuery(q);
    setPage("busqueda");
    toTop();
  };
  const logout = () => {
    setUser(null);
    setShowFav(false);
  };

  const BackHome = () => (
    <div className="gutter pt-8">
      <div className="max-w-7xl mx-auto">
        <button onClick={goHome} className="link muted"><Icon name="chevronL" size={14} /> Inicio</button>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen flex flex-col">
      <Nav onExplore={goEspecialidades} onLogoClick={goHome} onNews={goNews} onOpenFav={() => setShowFav(true)} onOpenAuth={() => user ? setShowFav(true) : setShowAuth(true)} onContact={openContact} onRequireTerms={goEspecialidades} onSearch={runSearch} termsAccepted={termsAccepted} favCount={favorites.length} user={user} />

      <main className="flex-1">
        {page === "home" ? (
          <>
            <Hero onExplore={goEspecialidades} onPick={pickCategory} onNews={goNews} />
            <NewsFeed />
            <OfertasBufetes favorites={favorites} toggleFav={toggleFav} onContact={openContact} />
            <JoinFirmsSection onOpen={() => setShowJoinFirm(true)} />
          </>
        ) : page === "busqueda" ? (
          <>
            <BackHome />
            <SearchResultsPage query={searchQuery} favorites={favorites} toggleFav={toggleFav} onContact={openContact} onPickCategory={pickCategory} />
          </>
        ) : (
          <>
            <BackHome />
            {!termsAccepted ? (
              <TermsGate onAccept={() => setTermsAccepted(true)} />
            ) : selectedCategory ? (
              <CategoryResults categoryId={selectedCategory} favorites={favorites} toggleFav={toggleFav} onBack={() => setSelectedCategory(null)} onContact={openContact} />
            ) : (
              <CategoryGrid onPick={pickCategory} />
            )}
          </>
        )}
      </main>

      <footer className="gutter py-12" style={{ borderTop: "1px solid var(--line)", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 96px)" }}>
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-5 text-[12.5px] muted">
          <div className="flex items-center gap-3">
            <FirmCrest name="Lexa LG" size={30} />
            <span><span className="f-display text-[15px]" style={{ color: "var(--ink)" }}>Lexa LG</span> — Legal Group · Bilbao · Madrid · desde 2004</span>
          </div>
          <div>Prototipo demostrativo. Los despachos y datos mostrados son ficticios.</div>
        </div>
      </footer>

      {contactFirm && contactStage === "policy" && (
        <ConsentModal
          onClose={closeContact}
          onAccept={() => setContactStage("form")}
        />
      )}
      {contactFirm && contactStage === "form" && (
        <ContactFormModal
          firm={contactFirm}
          onClose={closeContact}
          onSubmit={closeContact}
        />
      )}
      {showAuth && <AuthModal onClose={() => setShowAuth(false)} onLogin={(u) => { setUser(u); setShowAuth(false); }} />}
      {showFav && <FavoritesPanel favorites={favorites} toggleFav={toggleFav} onClose={() => setShowFav(false)} user={user} onLogout={logout} />}
      {showJoinFirm && <JoinFirmModal onClose={() => setShowJoinFirm(false)} />}

      <Concierge onOpenWizard={goEspecialidades} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
